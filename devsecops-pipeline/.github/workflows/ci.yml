name: DevSecOps CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  validate_and_publish:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: python-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test tools
        run: pip install -r requirements-dev.txt
      - name: Lint and format checks
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests and coverage
        run: |
          mkdir -p reports
          pytest --junitxml=reports/junit.xml --cov=app --cov-report=xml:reports/coverage.xml --cov-fail-under=80
      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scanners: secret
          exit-code: '1'
          format: json
          output: reports/trivy-secrets.json
      - name: OWASP Dependency-Check SCA
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: python-demo
          path: .
          format: JSON
          args: >-
            --failOnCVSS 7
      - name: SonarQube analysis and quality gate
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Runner must provide a pinned sonar-scanner installation.
          sonar-scanner -Dsonar.qualitygate.wait=true
      - name: Build Docker image
        if: github.event_name == 'push'
        run: |
          BRANCH="${GITHUB_REF_NAME//\//-}"
          BRANCH="$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g' | cut -c1-80)"
          echo "IMAGE_TAG=${BRANCH}-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          docker build -t "python-demo:${BRANCH}-${GITHUB_SHA:0:12}" .
      - name: Trivy container image vulnerability scan
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: image
          image-ref: python-demo:${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: reports/trivy-image.json
      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: ECR login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2
      - name: ECR push (only after Trivy image scan succeeds)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          docker tag "python-demo:${IMAGE_TAG}" "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text > image-digest.txt
      - name: Upload security/test reports (including on failed scans)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: |
            reports/
            image-digest.txt
          if-no-files-found: ignore
      - name: Upload approved image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v4
        with:
          name: approved-image-digest
          path: image-digest.txt
